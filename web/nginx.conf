# Sert l'application React compilee.
#
# Ce conteneur ne fait QUE servir des fichiers statiques : l'API est atteinte
# par le nginx hote, qui route /api/ vers le conteneur api. Un seul point
# d'entree public, donc pas de CORS ni de cookie inter-origines a gerer.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les fichiers portent une empreinte dans leur nom : ils peuvent etre
    # caches indefiniment. index.html, jamais — sinon un deploiement reste
    # invisible pour les navigateurs qui l'ont deja en cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        # Routage cote client : une URL inconnue rend index.html, sinon un
        # rafraichissement sur /revue donnerait un 404.
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
}
